<div class="topbar">
  <div class="brand">🎓 Student Management App</div>
  <nav>
    <a href="#">Home</a>
    <a href="#" class="active">Students</a>
    <a href="#">About</a>
  </nav>
</div>

<main class="main-layout">
  <app-student-list
     [students]="students()"
     (studentSelected)="onStudentSelected($event)"
     (deleteStudent)="onDeleteStudent($event)"
  ></app-student-list>

  <app-student-details
    [student]="selectedStudent()"
    (close)="onCloseDetails()"
  ></app-student-details>
</main>
